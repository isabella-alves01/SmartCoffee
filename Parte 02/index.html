<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Imagens e Vídeos (Parte 2)</title>
</head>
<body>
    <header>
        <h1>Imagens</h1>
        <nav>
            <ul>
                <li><a href="#imagens">Imagens</a></li>
                <li><a href="#Videos">Vídeo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="imagens">
            <figure class="imagem-intro">
                <img src="Imagens/images (1).jpg" alt="Imagem de Exemplo" loading="lazy" decoding="async">
            </figure>

            <figure class="imagem-resp">
                <img src="Imagens/images.jpg" alt="Imagem de Exemplo Responsiva">
            </figure>

            <figure class="imagem-fig">
                <img src="Imagens/images (2).jpg" alt="Paisagem">
                <figcaption>Modelo de paisagens</figcaption>
            </figure>

            <figure class="imagem-rec">
                <img src="Imagens/1000_F_75894966_grMyKtLrU2dDQzMNKxtkN9PfDxg5iQpE.jpg" alt="Modelo de Imagens">
            </figure>
        </section>

        <section class="Flex">
            <h1>Exemplos de Imagem</h1>
            <figure class="imagem-capa">
                <img src="Imagens/images (1).jpg" alt="Exemplo de imagem de capa">
            </figure>

            <figure class="imagem-ava">
                <img src="Imagens/1000_F_75894966_grMyKtLrU2dDQzMNKxtkN9PfDxg5iQpE.jpg" alt="Exemplo de avatar">
            </figure>
        </section>

        <section>
            <h1>Personalizando imagens</h1>
            <figure class="Imagem-seven">
                <img src="Imagens/Paisagem-1.jpg" alt="Paisagem personalizada">
            </figure>
        </section>
    
    <section class="imagem-gal-pr">
    <figure class="imagem-gal">
        <img src="Imagens/images (1).jpg" alt="Guitarra 8">
    </figure>
    <figure class="imagem-gal">
        <img src="Imagens/images (1).jpg" alt="Guitarra 9">
    </figure>
    <figure class="imagem-gal">
        <img src="Imagens/images (1).jpg" alt="Guitarra 10">
    </figure>
    </section>
    
    
    
    
    </main>
</body>
</html>
